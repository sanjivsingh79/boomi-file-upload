
spring.application.name=boomi-file-upload
server.port=8080

# Spring multipart upload limits
spring.servlet.multipart.max-file-size=2GB
spring.servlet.multipart.max-request-size=2050MB
spring.servlet.multipart.file-size-threshold=0B

# Boomi AFT
boomi.aft.base-url=https://boomi-preprod.thruinc.com
boomi.aft.api-key-header=ApiKey
boomi.aft.api-key=

# Endpoint IDs you have configured in AFT
boomi.aft.endpoint-path.doxis=flowendpoint:26360
boomi.aft.endpoint-path.sftp=flowendpoint:26360
boomi.aft.remote-path=/

# Upload chunk size: 8 MiB
# Must not exceed the max size returned by Boomi pre-flight.
boomi.aft.chunk-size-bytes=8388608

# HTTP timeouts and commit polling
boomi.aft.connect-timeout-seconds=15
boomi.aft.read-timeout-seconds=180
boomi.aft.commit-max-attempts=10
boomi.aft.commit-poll-default-seconds=2
